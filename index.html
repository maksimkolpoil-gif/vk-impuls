уты."},{id:"vid-2",title:"Игровой розыгрыш",date:"5 сентября",duration:"1:42",coachNote:"Хороший выход на страховку после блока. Дальше учим не замирать после удара — сразу возвращаться в позицию.",forParents:"Фрагмент из учебной игры. Смотрите не счёт, а как ребёнок двигается после своего действия."},{id:"vid-3",title:"Комментарий тренера для родителей",date:"1 сентября",duration:"3:05",coachNote:"За месяц вырос приём и дисциплина в разминке. Слабое место — подача в зону 1. Это цель сентября.",forParents:"Голосовой/видео формат «что происходит с учеником», чтобы не гадать по рассказам после зала."}],uh=[{id:"art-1",title:"Расстановка 4-2 простыми словами",minutes:4,excerpt:"Где стоят двое связующих и зачем ребёнку это понимать уже в детской группе.",body:"В схеме 4-2 на площадке два связующих. Когда один у сетки — он раздаёт передачи, второй играет в защите. Для новичка это проще, чем 5-1: меньше путаницы, кто должен отдать пас. На тренировке мы сначала ставим людей по зонам 1–6, потом включаем подачу и смотрим, не «теряется» ли кто после перехода. Дома достаточно нарисовать квадрат площадки и подписать шесть цифр — это уже половина понимания игры."},{id:"art-2",title:"Как принимать снизу, если нет зала",minutes:3,excerpt:"Три правила платформы, которые можно повторять без сетки.",body:"Первое: кисти вместе, локти прямые — получается одна площадка, а не две руки. Второе: мяч встречаем ногами, не руками — подшагиваем. Третье: угол платформы решает, куда улетит мяч. Стена, балкон или партнёр во дворе подходят. Лучше 10 осознанных повторений, чем 100 впопыхах."},{id:"art-3",title:"Зачем на волейболе ОФП",minutes:3,excerpt:"Почему 20 минут бега и планки — это не «потерянное время игры».",body:"Удар, блок и приём держатся на ногах и корпусе. Если ребёнок сразу играет «на счёт», техника ломается, как только он устал. ОФП в начале занятия включает тело и снижает травмы плеча и коленей. В тарифе Премиум часть ОФП можно делать дома по заданию — тогда в зале остаётся больше
